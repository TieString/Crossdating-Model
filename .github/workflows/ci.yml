name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.lock pytest==8.3.5
      - run: npm ci
      - run: python -m pytest
      - run: npm run typecheck
      - run: npm test
      - run: python scripts/audit_manifest.py datasets/fixtures/v5-smoke-manifest.json
      - run: python scripts/verify_release.py model-releases/v5.0.0
      - run: python scripts/reproduce_v5.py --smoke
