name: Full v5 reproduction

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: [self-hosted, model-training]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.lock pytest==8.3.5
      - run: npm ci
      - run: python scripts/rebuild_from_itrdb.py --download --workers 12
      - uses: actions/upload-artifact@v7
        with:
          name: v5-reproduction-${{ github.sha }}
          path: work/v5-rebuild/trained/
          retention-days: 30
