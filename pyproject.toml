[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossdating-model"
version = "5.0.0"
description = "Reproducible training and evaluation for automated tree-ring crossdating suggestions."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "GPL-3.0-only" }
dependencies = [
  "joblib==1.5.3",
  "lightgbm==4.6.0",
  "numpy==2.2.4",
  "PyYAML==6.0.2",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["crossdating_model*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"
